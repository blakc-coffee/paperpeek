<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>PaperPeek term popup mockup: hovering softmax shows a definition, formula and temperature demo</title>
  <rect width="760" height="440" rx="14" fill="#f6f7f9"/>

  <!-- paper page -->
  <rect x="24" y="24" width="712" height="392" rx="10" fill="#ffffff" stroke="#d9dce1"/>
  <text x="48" y="64" font-size="15" fill="#1f2937">… we apply a</text>
  <!-- highlighted term -->
  <rect x="137" y="47" width="66" height="24" rx="4" fill="#fef3c7"/>
  <line x1="139" y1="70" x2="201" y2="70" stroke="#d97706" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="141" y="64" font-size="15" fill="#92400e" font-weight="600">softmax</text>
  <text x="209" y="64" font-size="15" fill="#1f2937">function to obtain the weights on the values.</text>
  <path d="M176 66 l0 22 l6 -6 l5 11 l4 -2 l-5 -11 l8 0 z" fill="#111827" stroke="#ffffff" stroke-width="1.2"/>

  <!-- popup -->
  <path d="M160 98 l10 -10 l10 10 z" fill="#ffffff" stroke="#c7cdd6"/>
  <rect x="48" y="97" width="560" height="300" rx="12" fill="#ffffff" stroke="#c7cdd6"/>
  <rect x="154" y="96" width="32" height="4" fill="#ffffff"/>

  <text x="70" y="130" font-size="17" fill="#111827" font-weight="700">Softmax</text>
  <rect x="150" y="115" width="88" height="22" rx="11" fill="#ecfdf5"/>
  <text x="194" y="130" font-size="12" fill="#047857" text-anchor="middle">AI/ML term</text>
  <text x="70" y="158" font-size="14" fill="#374151">Turns a vector of scores into probabilities that are positive and sum to 1.</text>

  <!-- formula -->
  <rect x="70" y="172" width="250" height="56" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="86" y="206" font-size="19" fill="#111827" font-family="Cambria Math, STIX Two Math, Times New Roman, serif">softmax(<tspan font-style="italic">z</tspan>)<tspan font-size="13" dy="5" font-style="italic">i</tspan><tspan dy="-5"> =</tspan></text>
  <text x="232" y="196" font-size="16" fill="#111827" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-style="italic">e<tspan font-size="11" dy="-7">z<tspan font-size="9" dy="3">i</tspan></tspan></text>
  <line x1="226" y1="203" x2="306" y2="203" stroke="#111827" stroke-width="1.3"/>
  <text x="228" y="221" font-size="15" fill="#111827" font-family="Cambria Math, STIX Two Math, Times New Roman, serif">Σ<tspan font-size="10" dy="4" font-style="italic">j</tspan><tspan dy="-4" font-style="italic"> e</tspan><tspan font-size="11" dy="-7" font-style="italic">z<tspan font-size="9" dy="3">j</tspan></tspan></text>

  <!-- demo -->
  <text x="350" y="186" font-size="12.5" fill="#6b7280" font-weight="600">TRY IT · temperature τ</text>
  <g fill="#6366f1">
    <rect x="352" y="262" width="34" height="0"/>
    <rect x="352" y="210" width="34" height="52" rx="3"/>
    <rect x="396" y="236" width="34" height="26" rx="3"/>
    <rect x="440" y="196" width="34" height="66" rx="3"/>
    <rect x="484" y="248" width="34" height="14" rx="3"/>
    <rect x="528" y="242" width="34" height="20" rx="3"/>
  </g>
  <line x1="348" y1="262" x2="568" y2="262" stroke="#9ca3af"/>
  <line x1="352" y1="290" x2="562" y2="290" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
  <line x1="352" y1="290" x2="420" y2="290" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="420" cy="290" r="8" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="352" y="312" font-size="11.5" fill="#6b7280">sharp</text>
  <text x="562" y="312" font-size="11.5" fill="#6b7280" text-anchor="end">flat</text>

  <line x1="70" y1="336" x2="586" y2="336" stroke="#eef0f3"/>
  <text x="70" y="364" font-size="13" fill="#2563eb" font-weight="600">Related: attention · logits · cross-entropy</text>
  <text x="586" y="364" font-size="11.5" fill="#9ca3af" text-anchor="end">Source: PaperPeek glossary (MIT)</text>
</svg>
