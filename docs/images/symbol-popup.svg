<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>PaperPeek symbol popup mockup: hovering d_k shows where it was defined</title>
  <rect width="760" height="400" rx="14" fill="#f6f7f9"/>

  <!-- paper page -->
  <rect x="24" y="24" width="712" height="352" rx="10" fill="#ffffff" stroke="#d9dce1"/>
  <text x="48" y="60" font-size="13" fill="#6b7280" font-weight="600">3.2.1  Scaled Dot-Product Attention</text>
  <text x="48" y="92" font-size="15" fill="#1f2937">We compute the attention function on a set of queries simultaneously:</text>

  <!-- equation -->
  <text x="150" y="140" font-size="22" fill="#111827" font-family="Cambria Math, STIX Two Math, Times New Roman, serif">
    Attention(<tspan font-style="italic">Q</tspan>, <tspan font-style="italic">K</tspan>, <tspan font-style="italic">V</tspan>) = softmax(
  </text>
  <text x="455" y="128" font-size="20" fill="#111827" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-style="italic">QK<tspan font-size="13" dy="-8">T</tspan></text>
  <line x1="448" y1="136" x2="520" y2="136" stroke="#111827" stroke-width="1.5"/>
  <text x="452" y="162" font-size="20" fill="#111827" font-family="Cambria Math, STIX Two Math, Times New Roman, serif">√</text>
  <!-- hovered symbol -->
  <rect x="468" y="143" width="40" height="27" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="474" y="162" font-size="20" fill="#1d4ed8" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-style="italic">d<tspan font-size="13" dy="5">k</tspan></text>
  <text x="528" y="140" font-size="22" fill="#111827" font-family="Cambria Math, STIX Two Math, Times New Roman, serif">) <tspan font-style="italic">V</tspan></text>

  <!-- cursor -->
  <path d="M500 158 l0 22 l6 -6 l5 11 l4 -2 l-5 -11 l8 0 z" fill="#111827" stroke="#ffffff" stroke-width="1.2"/>

  <!-- popup -->
  <g>
    <path d="M488 196 l10 -10 l10 10 z" fill="#ffffff" stroke="#c7cdd6"/>
    <rect x="236" y="195" width="476" height="160" rx="12" fill="#ffffff" stroke="#c7cdd6"/>
    <rect x="482" y="194" width="32" height="4" fill="#ffffff"/>
    <text x="258" y="226" font-size="18" fill="#1d4ed8" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-style="italic">d<tspan font-size="12" dy="5">k</tspan></text>
    <text x="290" y="226" font-size="15" fill="#111827" font-weight="600">dimension of queries and keys</text>
    <rect x="590" y="211" width="102" height="22" rx="11" fill="#eef2ff"/>
    <text x="641" y="226" font-size="12" fill="#4338ca" text-anchor="middle">Defined in §3.2.1</text>

    <rect x="258" y="246" width="3" height="44" fill="#93c5fd"/>
    <text x="272" y="263" font-size="13.5" fill="#374151" font-style="italic">“The input consists of queries and keys of dimension</text>
    <text x="272" y="283" font-size="13.5" fill="#374151" font-style="italic"><tspan font-weight="700" fill="#1d4ed8">d_k</tspan>, and values of dimension d_v.”</text>

    <text x="258" y="331" font-size="13" fill="#2563eb" font-weight="600">↑ Jump to definition</text>
    <text x="410" y="331" font-size="12.5" fill="#6b7280">Quoted from this paper, not AI-generated</text>
  </g>
</svg>
