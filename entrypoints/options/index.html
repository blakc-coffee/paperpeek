<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="manifest.open_in_tab" content="false" />
    <title>PaperPeek options</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #111827; --muted: #6b7280; --accent: #2563eb; --border: rgb(0 0 0 / 0.08);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1f2430; --fg: #f3f4f6; --muted: #9ca3af; --accent: #93c5fd; --border: rgb(255 255 255 / 0.10); }
      }
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 400 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 12px; color: var(--muted); }
      fieldset { margin: 0; padding: 12px; border: 1px solid var(--border); border-radius: 8px; }
      legend { padding: 0 4px; font-weight: 500; }
      label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
      input { accent-color: var(--accent); margin-top: 3px; }
      input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      small { display: block; color: var(--muted); font-size: 12px; line-height: 16px; }
      output { display: block; min-height: 16px; margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>PaperPeek</h1>
    <p>Select a word or phrase in a paper to look it up. Terms in the bundled glossary always work offline.</p>
    <fieldset>
      <legend>Wikipedia lookups for other terms</legend>
      <label><input type="radio" name="wikipedia" value="ask" /><span>Ask each time <small>Default. A button sends only the selected term.</small></span></label>
      <label><input type="radio" name="wikipedia" value="always" /><span>Always look up <small>Sends each selected term not in the glossary. Results are cached for 7 days.</small></span></label>
      <label><input type="radio" name="wikipedia" value="never" /><span>Never <small>No network requests at all.</small></span></label>
    </fieldset>
    <output id="status" aria-live="polite"></output>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
