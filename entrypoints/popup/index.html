<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperPeek</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #111827; --muted: #6b7280; --accent: #2563eb; --accent-fg: #ffffff;
        --accent-bg: #eff6ff; --border: rgb(0 0 0 / 0.08);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1f2430; --fg: #f3f4f6; --muted: #9ca3af; --accent: #93c5fd; --accent-fg: #111827; --accent-bg: rgb(147 197 253 / 0.12); --border: rgb(255 255 255 / 0.10); }
      }
      body { margin: 0; width: 280px; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--fg); font: 400 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
      #site { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 16px; overflow-wrap: anywhere; }
      #status { margin: 0 0 12px; }
      button {
        all: unset; box-sizing: border-box; width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 8px; text-align: center; cursor: pointer;
        background: var(--accent); color: var(--accent-fg); font-weight: 600;
        transition: transform 100ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      button.secondary { background: var(--accent-bg); color: var(--accent); }
      button:active { transform: scale(0.98); }
      button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button[hidden] { display: none; }
      footer { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; line-height: 16px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>PaperPeek</h1>
    <p id="site"></p>
    <p id="status" aria-live="polite">Checking this site…</p>
    <button id="toggle" type="button" hidden></button>
    <footer><a href="#" id="options">Wikipedia lookup settings</a></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
