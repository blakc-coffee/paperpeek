<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperPeek symbols</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #111827; --muted: #6b7280; --accent: #2563eb; --accent-bg: #eff6ff; --border: rgb(0 0 0 / 0.08);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1f2430; --fg: #f3f4f6; --muted: #9ca3af; --accent: #93c5fd; --accent-bg: rgb(147 197 253 / 0.12); --border: rgb(255 255 255 / 0.10); }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      header { position: sticky; top: 0; z-index: 1; display: grid; gap: 8px; padding: 16px 16px 12px; background: var(--bg); border-bottom: 1px solid var(--border); }
      .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      h1 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; }
      #paper { margin: 0; color: var(--muted); font-size: 12px; line-height: 16px; overflow-wrap: anywhere; }
      input[type="search"] { width: 100%; min-height: 36px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--fg); font: inherit; }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.refresh { font: inherit; font-size: 12px; min-height: 28px; padding: 2px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; }
      main { padding: 8px 16px 24px; display: grid; gap: 16px; }
      h2 { margin: 0 0 4px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
      .row { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: minmax(48px, auto) 1fr auto; gap: 10px; align-items: baseline; padding: 8px; border-radius: 8px; cursor: pointer; }
      @media (hover: hover) { .row:hover { background: var(--accent-bg); } }
      .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
      .key { color: var(--accent); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; }
      .gloss { overflow-wrap: anywhere; }
      .gloss.missing { color: var(--muted); }
      .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .empty { color: var(--muted); padding: 24px 0; }
    </style>
  </head>
  <body>
    <header>
      <div class="top"><h1>Symbols on this page</h1><button type="button" class="refresh" id="refresh">Refresh</button></div>
      <p id="paper"></p>
      <input type="search" id="filter" placeholder="Filter symbols or meanings" aria-label="Filter symbols or meanings" />
    </header>
    <main id="list" aria-live="polite"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
